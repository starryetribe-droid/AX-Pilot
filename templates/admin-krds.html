<style>
/* ===== KRDS 기본 어드민 템플릿 (PC) — .adm-* 클래스 계약은 admin-pulmuone과 동일, 룩만 KRDS 토큰 ===== */
.admin-canvas{--adm-primary:var(--krds-primary-50);--adm-primary-d:var(--krds-primary-60);--adm-primary-bg:var(--krds-primary-5);
 --adm-bg:var(--krds-gray-5);--adm-line:var(--krds-gray-10);--adm-red:var(--krds-danger-50);
 width:1400px;min-height:900px;background:#fff;border-radius:0;overflow:visible;
 box-shadow:0 2px 16px rgba(0,0,0,.08);font-family:var(--krds-font);color:var(--krds-gray-80);font-size:13px;position:relative;}
.admin-canvas, .admin-canvas *{box-sizing:border-box;font-family:var(--krds-font);}
.adm-num{position:absolute;z-index:6;min-width:22px;height:22px;padding:0 6px;border-radius:11px;
 background:var(--krds-danger-5);color:var(--krds-danger-50);border:1px solid var(--krds-danger-50);
 font-size:10px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
.adm-num.sub{position:static;min-width:18px;height:16px;padding:0 5px;border-radius:8px;font-size:8.5px;background:#fff;flex-shrink:0;}
/* topbar */
.adm-topbar{position:relative;height:58px;background:#fff;border-bottom:1px solid var(--krds-gray-20);
 display:flex;align-items:center;justify-content:space-between;padding:0 22px;}
.adm-topbar>.adm-num{top:6px;left:6px;}
.adm-logo{display:flex;align-items:center;gap:10px;}
.adm-logo .mark{font-weight:800;font-size:15px;line-height:1;letter-spacing:.5px;color:var(--krds-gray-90);}
.adm-logo .dots{display:grid;grid-template-columns:repeat(3,4px);grid-auto-rows:4px;gap:2px;}
.adm-logo .dots i{width:4px;height:4px;background:var(--adm-primary);border-radius:1px;display:block;}
.adm-logo .mode{font-weight:700;font-size:12.5px;color:var(--adm-primary-d);background:var(--adm-primary-bg);
 border-radius:var(--krds-radius-sm);padding:4px 10px;margin-left:6px;}
.adm-utils{display:flex;align-items:center;gap:18px;color:var(--krds-gray-60);font-size:12.5px;}
.adm-utils span{display:inline-flex;align-items:center;gap:6px;}
.adm-utils .gi{width:13px;height:13px;border-radius:3px;background:var(--krds-gray-30);display:inline-block;}
/* body row */
.adm-body{display:flex;min-height:842px;}
.adm-gnb{position:relative;width:198px;background:#fff;border-right:1px solid var(--adm-line);padding:8px 0;}
.adm-gnb>.adm-num{top:6px;left:6px;}
.adm-gnb .grp{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;color:var(--krds-gray-70);}
.adm-gnb .grp.active{color:var(--adm-primary-d);font-weight:700;}
.adm-gnb .grp .cv{font-size:9px;color:var(--krds-gray-30);}
.adm-gnb .grp.active .cv{color:var(--adm-primary-d);}
.adm-gnb .sub{background:var(--krds-gray-5);border-top:1px solid var(--adm-line);border-bottom:1px solid var(--adm-line);}
.adm-gnb .sub a{display:block;padding:9px 18px 9px 30px;color:var(--krds-gray-50);text-decoration:none;font-size:12.5px;}
.adm-gnb .sub a.active{color:var(--adm-primary-d);font-weight:700;background:var(--adm-primary-bg);
 border-left:3px solid var(--adm-primary);padding-left:27px;}
/* main */
.adm-main{position:relative;flex:1;background:var(--adm-bg);padding:20px 24px 56px;}
.adm-page-head{position:relative;display:flex;align-items:center;justify-content:space-between;margin:2px 2px 16px;}
.adm-page-head>.adm-num{top:-4px;left:-12px;}
.adm-page-head .ttl{font-size:20px;font-weight:700;color:var(--krds-gray-90);}
.adm-page-head .ttl .oid{color:var(--krds-gray-70);font-weight:700;}
.adm-page-head .acts{display:flex;gap:12px;}
.adm-page-head .acts .gi{width:22px;height:20px;border-radius:3px;background:var(--krds-gray-20);display:inline-block;}
.adm-card{position:relative;background:#fff;border:1px solid var(--adm-line);border-radius:var(--krds-radius-md);margin-bottom:14px;}
.adm-card>.adm-num{top:-9px;left:-9px;}
.adm-kv{display:grid;grid-template-columns:120px 1fr 120px 1fr 120px 1fr;}
.adm-kv>div{padding:13px 16px;border-bottom:1px solid var(--krds-gray-5);font-size:13px;}
.adm-kv .k{color:var(--krds-gray-50);}
.adm-kv .v{color:var(--krds-gray-80);}
.adm-kv .lastrow{border-bottom:none;}
/* 배송지 */
.adm-ship{display:grid;grid-template-columns:120px 210px 1fr 150px 130px;}
.adm-ship .h{background:var(--krds-gray-5);color:var(--krds-gray-50);padding:11px 16px;border-bottom:1px solid var(--adm-line);font-size:12.5px;text-align:center;}
.adm-ship .c{padding:14px 16px;color:var(--krds-gray-80);font-size:13px;text-align:center;}
.adm-ship .c.l{text-align:left;}
.adm-pill-input{display:inline-block;border:1px solid var(--adm-line);border-radius:var(--krds-radius-md);padding:6px 14px;color:var(--krds-gray-60);background:var(--krds-gray-5);font-size:12.5px;}
/* memo + summary */
.adm-flex{display:flex;gap:14px;margin-bottom:14px;align-items:stretch;}
.adm-memo{position:relative;flex:1;background:#fff;border:1px solid var(--adm-line);border-radius:var(--krds-radius-md);padding:14px;}
.adm-memo .ta{width:100%;height:300px;border:1px solid var(--adm-line);border-radius:var(--krds-radius-sm);background:var(--krds-gray-5);color:var(--krds-gray-40);padding:12px;font-size:13px;}
.adm-summary{position:relative;width:330px;background:#fff;border:1px solid var(--adm-line);border-radius:var(--krds-radius-md);padding:6px 0;}
.adm-summary .row{display:flex;justify-content:space-between;padding:11px 18px;font-size:13px;border-bottom:1px solid var(--krds-gray-5);}
.adm-summary .row .lb{color:var(--krds-gray-50);}
.adm-summary .row .vl{color:var(--krds-gray-80);}
.adm-summary .row .vl.red{color:var(--adm-red);}
.adm-summary .row.total{font-weight:700;border-bottom:none;}
.adm-summary .total-box{margin:6px 14px 12px;background:var(--krds-gray-5);border-radius:var(--krds-radius-sm);padding:12px 14px;color:var(--krds-gray-70);font-size:13px;}
/* actions */
.adm-actions{position:relative;display:flex;justify-content:flex-end;gap:10px;margin-bottom:14px;}
.adm-actions>.adm-num{top:2px;left:-12px;}
.adm-btn{background:var(--adm-primary);color:#fff;border:none;border-radius:var(--krds-radius-md);padding:9px 24px;font-size:13px;font-weight:600;font-family:var(--krds-font);}
/* warn */
.adm-warn{position:relative;color:var(--adm-red);font-size:13px;font-weight:600;margin:6px 2px 12px;}
.adm-warn>.adm-num{top:-2px;left:-12px;}
/* table */
.adm-table-wrap{position:relative;background:#fff;border:1px solid var(--adm-line);border-radius:var(--krds-radius-md);overflow:visible;}
.adm-table-wrap>.adm-num{top:-9px;left:-9px;}
.adm-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.adm-table th{background:var(--krds-gray-5);color:var(--krds-gray-70);font-weight:700;padding:13px 6px;border-bottom:1px solid var(--krds-gray-20);text-align:center;white-space:nowrap;}
.adm-table td{padding:16px 6px;border-bottom:1px solid var(--krds-gray-5);color:var(--krds-gray-70);text-align:center;}
.adm-table td.l{text-align:left;}
.adm-status{display:inline-block;border:1px solid var(--adm-primary);color:var(--adm-primary-d);border-radius:var(--krds-radius-sm);padding:5px 14px;font-size:12px;}
.adm-chk{width:15px;height:15px;border:1px solid var(--krds-gray-30);border-radius:3px;display:inline-block;vertical-align:middle;}
/* fab */
.adm-fab{position:absolute;right:18px;bottom:14px;width:38px;height:38px;border-radius:50%;background:var(--adm-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
/* filter */
.adm-filter{display:grid;grid-template-columns:120px 1fr 120px 1fr 120px 1fr 120px 1fr;}
.adm-filter .k{background:var(--krds-gray-5);color:var(--krds-gray-60);padding:11px 14px;border-bottom:1px solid var(--krds-gray-5);font-size:12.5px;display:flex;align-items:center;}
.adm-filter .v{padding:8px 14px;border-bottom:1px solid var(--krds-gray-5);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.adm-select{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:130px;border:1px solid var(--krds-gray-20);border-radius:var(--krds-radius-sm);padding:7px 10px;background:#fff;color:var(--krds-gray-70);font-size:12.5px;}
.adm-select .ar{color:var(--krds-gray-40);font-size:9px;}
.adm-input{display:inline-flex;align-items:center;border:1px solid var(--krds-gray-20);border-radius:var(--krds-radius-sm);padding:7px 10px;background:#fff;color:var(--krds-gray-40);font-size:12.5px;}
.adm-filter-acts{display:flex;justify-content:center;gap:10px;padding:14px;position:relative;}
.adm-btn-line{background:#fff;color:var(--krds-gray-70);border:1px solid var(--krds-gray-30);border-radius:var(--krds-radius-md);padding:9px 24px;font-size:13px;font-weight:600;font-family:var(--krds-font);}
/* toolbar */
.adm-toolbar{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.adm-toolbar .total{font-size:13px;color:var(--krds-gray-60);}
.adm-toolbar .right{display:flex;gap:10px;align-items:center;position:relative;}
/* pagination */
.adm-paging{position:relative;display:flex;justify-content:center;gap:6px;margin-top:16px;}
.adm-paging span:not(.adm-num){min-width:28px;height:28px;padding:0 6px;border:1px solid var(--krds-gray-20);border-radius:var(--krds-radius-sm);background:#fff;color:var(--krds-gray-60);font-size:12px;display:inline-flex;align-items:center;justify-content:center;}
.adm-paging .adm-num{margin-right:6px;}
.adm-paging span.cur{background:var(--adm-primary);border-color:var(--adm-primary);color:#fff;font-weight:700;}
/* popup (대화 로그 등 오버레이 내부) */
.adm-pop-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--adm-line);font-weight:700;color:var(--krds-gray-90);font-size:14px;position:relative;}
.adm-pop-x{color:var(--krds-gray-40);font-size:14px;font-weight:400;}
.adm-pop-sec{padding:10px 16px 4px;font-size:11px;font-weight:700;color:var(--krds-gray-50);letter-spacing:.04em;}
.adm-pop-kv{display:grid;grid-template-columns:104px 1fr;font-size:12px;}
.adm-pop-kv .k{color:var(--krds-gray-50);background:var(--krds-gray-5);padding:8px 12px;border-bottom:1px solid var(--krds-gray-5);}
.adm-pop-kv .v{color:var(--krds-gray-80);padding:8px 12px;border-bottom:1px solid var(--krds-gray-5);word-break:break-all;}
.adm-copy{display:inline-block;width:14px;height:14px;border:1px solid var(--krds-gray-30);border-radius:3px;margin-left:6px;vertical-align:-2px;background:var(--krds-gray-5);}
.adm-turn{padding:10px 14px;border-bottom:1px solid var(--krds-gray-5);}
.adm-turn .meta{font-size:10.5px;color:var(--krds-gray-50);margin-bottom:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.adm-tag{display:inline-block;border:1px solid var(--adm-primary);color:var(--adm-primary-d);border-radius:10px;padding:2px 8px;font-size:10px;}
.adm-tag.gray{border-color:var(--krds-gray-30);color:var(--krds-gray-60);}
.adm-bubble{border-radius:var(--krds-radius-lg);padding:8px 10px;font-size:12px;line-height:1.5;margin-top:6px;}
.adm-bubble.user{background:var(--krds-gray-5);color:var(--krds-gray-80);}
.adm-bubble.bot{background:var(--krds-primary-5);color:var(--krds-gray-80);}
.adm-toast{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:9px 18px;border-radius:18px;white-space:nowrap;}
</style>
