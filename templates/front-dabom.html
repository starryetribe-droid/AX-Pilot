/* ============================================================
   다봄(고대 AI 심리 앱) 프론트 와이어프레임 템플릿 — front-dabom v0.2
   - 기준 화면: Figma «사진첩_상세 Ver.0.3» (node 1385-7006) — 실제 다봄 SB 작성 방식
       https://www.figma.com/design/w1l4o5F4fU3gnY2viMzc00/?node-id=1385-7006

   - 모바일 앱 전용: 캔버스 390 × min 844 / 좌우 여백 16 → 콘텐츠 358
   - 시니어 대상 앱 → 본문 18px · 버튼 높이 60 · 라운드 8 · Noto Sans KR
   - 시트 배치(.dabom-board): 와이어프레임 좌상단 → 우측 Case 변형 → 하단 Confirm/Toast 흐름
   - 모든 클래스는 .dabom-board / .dabom-canvas 스코프 — KRDS 공통 스타일과 충돌 없음
   - 규칙·카탈로그: reference/dabom-front-guide.md (Figma 수정 시 템플릿 → 가이드 순 갱신)
   ============================================================ */
.dabom-board, .dabom-canvas{
 --d-ink:#171717; --d-title:#1F2937; --d-g700:#404040; --d-g600:#525252; --d-g500:#737373;
 --d-g400:#A3A3A3; --d-g300:#D4D4D4; --d-g200:#E5E5E5; --d-g100:#F5F5F5; --d-g50:#FAFAFA;
 --d-frame:#CED4DA; --d-note:#D9D9D9; --d-blue:#1A73E8; --d-red:#E5484D; --d-dim:rgba(0,0,0,.5);
 --d-badge:rgba(255,0,0,.6); --d-tag:rgba(119,13,28,.62); --d-tap:#F5A623;
 --d-font:"Noto Sans KR",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}

/* ===== 0. 시트 배치 — wf-panel에 .dabom-board 부여 =====
   .wf-panel.dabom-board
     ├ .wf-canvas-wrap  : num-strip + 와이어프레임(.wf-canvas.dabom-canvas) + 우측 .dbm-cases
     └ .dbm-flow        : 하단 Confirm/Toast/이동 흐름 (가로 나열, 화살표·노트) */
.wf-panel.dabom-board{align-items:flex-start;padding:28px 30px 60px;font-family:var(--d-font);}
.dabom-board .wf-canvas-wrap{gap:0;}
.dabom-board *{box-sizing:border-box;}

/* 넘버 배지 — 다봄 양식: 반투명 레드 원형, 요소 좌상단 모서리에 걸침 (레이아웃 무영향 오버레이) */
.dabom-board .num-badge{position:absolute;top:-15px;left:-15px;width:31px;height:31px;min-width:0;padding:0;
 border:0;border-radius:50%;background:var(--d-badge);color:#fff;font-size:15px;font-weight:700;
 display:flex;align-items:center;justify-content:center;z-index:10;line-height:1;}
.dabom-board .num-badge.edge{left:-34px;top:-6px;} /* 라벨·텍스트가 좌상단에 붙은 요소용 — 캔버스 가장자리에 걸침 */
.dabom-canvas .dbm-field > .num-badge{left:-34px;top:-6px;}  /* 입력 필드: 라벨 가림 방지 */
/* 세부 배지 / Case 태그 — 짙은 레드 캡슐 ("3-1", "Case1) 사진") */
.dabom-board .dbm-tag{display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:27px;
 background:var(--d-tag);color:#fff;font-size:15px;font-weight:700;line-height:1;white-space:nowrap;}
.dabom-board .dbm-tag.pin{position:absolute;top:-11px;left:0;z-index:9;}

/* 우측 Case 변형 — 같은 영역의 상태별 대안 (와이어프레임 우측에 가로 나열) */
.dabom-board .dbm-cases{display:flex;gap:56px;padding:116px 0 0 64px;align-items:flex-start;}
.dabom-board .dbm-case{width:358px;display:flex;flex-direction:column;gap:8px;position:relative;}

/* 하단 흐름 — Confirm/Alert/Toast + 이동 노트 + 화살표 */
.dabom-board .dbm-flow{display:flex;align-items:flex-start;gap:16px;margin:64px 0 0 52px;flex-wrap:wrap;}
.dabom-board .dbm-ov{display:flex;flex-direction:column;align-items:center;gap:22px;position:relative;}
/* 오버레이 유형명 바 (창 밖 상단) — "삭제 여부 Confirm" / "삭제 완료 Toast msg" */
.dabom-board .dbm-ov-title{align-self:stretch;height:41px;background:var(--d-g500);color:#fff;font-size:20px;font-weight:700;
 display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 16px;}
.dabom-board .dbm-note{background:var(--d-note);padding:16px 13px;font-size:14px;letter-spacing:-.7px;color:#000;white-space:nowrap;}
.dabom-board .dbm-ver{display:inline-flex;align-items:center;height:35px;padding:0 10px;background:var(--d-note);font-size:13px;font-weight:700;color:#000;white-space:nowrap;}
.dabom-board .dbm-arrow{align-self:center;width:40px;height:8px;flex-shrink:0;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 6 8'><path d='M.5.5 5 4 .5 7.5' fill='none' stroke='black' stroke-width='1'/></svg>") right center/6px 8px no-repeat,
 repeating-linear-gradient(to right,#000 0 1px,transparent 1px 3px) left center/calc(100% - 1px) 1px no-repeat;}

 font-size:18px;line-height:1.6;border:0;outline:2px solid var(--d-frame);border-radius:8px;box-shadow:none;overflow:visible;}

/* ===== 2. Header — 최상단 Sticky (56) =====
   변형: main · sub · test · chatbot(=policy) · reward · notice · mypage (가이드 §2 표) */
.dabom-canvas .dbm-header{position:relative;height:56px;flex-shrink:0;display:flex;align-items:center;padding:0 23px 0 16px;
 background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.05);}
.dabom-canvas .dbm-header .back{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.dabom-canvas .dbm-header .title{font-size:18px;font-weight:700;line-height:24px;color:var(--d-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dabom-canvas .dbm-header .logo{font-size:20px;font-weight:800;flex:1;color:var(--d-title);}
.dabom-canvas .dbm-header .acts{margin-left:auto;display:flex;align-items:center;gap:14px;}
.dabom-canvas .dbm-header .bell{position:relative;display:flex;}
.dabom-canvas .dbm-header .bell .dot{position:absolute;top:-3px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--d-red);}
.dabom-canvas .is-hidden-1st{opacity:.35;outline:1px dashed var(--d-g500);outline-offset:2px;}

/* ===== 3. 본문 요소 (사진첩_상세 기준) ===== */
.dabom-canvas .dbm-main{display:flex;flex-direction:column;gap:22px;padding:13px 16px 24px;}
.dabom-canvas .dbm-date{display:flex;align-items:center;justify-content:space-between;height:52px;position:relative;}
.dabom-canvas .dbm-date .d{display:flex;align-items:center;gap:12px;font-size:24px;line-height:32px;color:var(--d-ink);}
.dabom-canvas .dbm-fav{width:52px;height:52px;border-radius:50%;background:var(--d-g50);border:2px solid var(--d-g200);display:flex;align-items:center;justify-content:center;position:relative;}
.dabom-canvas .dbm-img{position:relative;height:320px;border-radius:8px;background:var(--d-g300);display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.35;color:#000;}
.dabom-canvas .dbm-textview{position:relative;min-height:120px;border-radius:8px;background:var(--d-g50);border:1px solid var(--d-g200);padding:13px 17px;font-size:18px;line-height:30px;color:#000;}
.dabom-canvas .dbm-btns{display:flex;flex-direction:column;gap:16px;}
.dabom-canvas .dbm-btn-row{display:flex;gap:16px;}
.dabom-canvas .dbm-btn-row > *{flex:1;}
.dabom-canvas .dbm-btn{position:relative;height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:12px;
 font-size:18px;background:var(--d-g600);color:#fff;}
.dabom-canvas .dbm-btn.secondary{height:62px;background:var(--d-g100);border:1px solid var(--d-g300);color:var(--d-g700);}
.dabom-canvas .dbm-btn.tertiary{height:62px;background:var(--d-g50);border:1px solid var(--d-g200);color:var(--d-g600);}
.dabom-canvas .dbm-btn.disabled{background:var(--d-g200);color:var(--d-g400);border:0;}
.dabom-canvas .dbm-btn.sm{height:44px;font-size:16px;}
.dabom-canvas .dbm-h1{font-size:24px;font-weight:700;line-height:1.4;}
.dabom-canvas .dbm-h2{font-size:20px;font-weight:700;}
.dabom-canvas .dbm-body{font-size:18px;color:var(--d-g700);}
.dabom-canvas .dbm-caption{font-size:15px;color:var(--d-g500);}

/* ===== 4. App bar — 최하단 Sticky (5탭: 홈 / 두뇌 건강 / 대화 / 내 정원 / 사진첩) ===== */
.dabom-canvas .dbm-appbar{position:relative;height:68px;flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--d-g200);}
.dabom-canvas .dbm-appbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--d-g500);}
.dabom-canvas .dbm-appbar .tab::before{content:"";width:24px;height:24px;border-radius:50%;background:var(--d-g200);}
.dabom-canvas .dbm-appbar .tab.on{color:var(--d-ink);font-weight:700;}
.dabom-canvas .dbm-appbar .tab.on::before{background:var(--d-g600);}

/* ===== 5. CTA 영역 — 하단 고정(Sticky), 최대 2개 (좌 Negative · 우 Positive) ===== */
.dabom-canvas .dbm-cta{position:relative;height:60px;flex-shrink:0;display:flex;}
.dabom-canvas .dbm-cta > :not(.num-badge){display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
.dabom-canvas .dbm-cta .primary{flex:1;background:var(--d-g600);color:#fff;}
.dabom-canvas .dbm-cta .primary.disabled{background:var(--d-g200);color:var(--d-g400);}
.dabom-canvas .dbm-cta .secondary{flex:0 0 38%;background:var(--d-g100);color:var(--d-g700);}
.dabom-canvas .dbm-keypad{height:216px;flex-shrink:0;background:#D1D4DA;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--d-g600);}

/* ===== 6. Input ===== */
.dabom-canvas .dbm-field{position:relative;display:flex;flex-direction:column;gap:8px;}
.dabom-canvas .dbm-field > .label{font-size:16px;font-weight:700;color:var(--d-g700);}
.dabom-canvas .dbm-input{height:52px;border:1px solid var(--d-g300);border-radius:8px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:18px;}
.dabom-canvas .dbm-input .ph{color:var(--d-g400);flex:1;} .dabom-canvas .dbm-input .val{flex:1;}
.dabom-canvas .dbm-input .timer{font-size:15px;color:var(--d-g700);}
.dabom-canvas .dbm-input.error{border-color:var(--d-red);}
.dabom-canvas .dbm-input.disabled{background:var(--d-g100);color:var(--d-g400);}
.dabom-canvas .dbm-err{font-size:15px;color:var(--d-red);}
